# Prometheus Configuration for GlobalMart System Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'globalmart'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - localhost:9093

# Rule files (for alerting rules)
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'

  # GlobalMart API
  - job_name: 'globalmart_api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          component: 'api'
          service: 'globalmart-analytics-api'

  # Kafka Exporter
  - job_name: 'kafka'
    static_configs:
      - targets: ['localhost:9091']
        labels:
          component: 'kafka'
          service: 'message-broker'

  # Spark Exporter
  - job_name: 'spark'
    static_configs:
      - targets: ['localhost:9092']
        labels:
          component: 'spark'
          service: 'stream-processing'

  # PostgreSQL Exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['localhost:9093']
        labels:
          component: 'postgresql'
          service: 'data-warehouse'

  # Node Exporter (system metrics - optional but recommended)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          component: 'system'
          service: 'node-metrics'
