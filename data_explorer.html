<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobalMart Data Explorer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #89cff0 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .header {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .header h1 {
        color: #667eea;
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        color: #666;
        font-size: 1.1em;
      }

      .controls {
        background: white;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .controls h3 {
        color: #333;
        margin-bottom: 15px;
      }

      .filter-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        align-items: center;
      }

      .filter-group label {
        font-weight: 600;
        color: #555;
      }

      .filter-group select,
      .filter-group input {
        padding: 10px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1em;
        transition: all 0.3s;
      }

      .filter-group select:focus,
      .filter-group input:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        background: linear-gradient(135deg, #667eea 0%, #89cff0 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s;
      }

      .stat-card:hover {
        transform: translateY(-5px);
      }

      .stat-card h3 {
        color: #888;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }

      .stat-card .value {
        font-size: 2.5em;
        font-weight: bold;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .data-section {
        background: white;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .data-section h2 {
        color: #333;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 3px solid #667eea;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: linear-gradient(135deg, #667eea 0%, #89cff0 100%);
        color: white;
        padding: 15px;
        text-align: left;
        font-weight: 600;
      }

      td {
        padding: 12px 15px;
        border-bottom: 1px solid #f0f0f0;
      }

      tr:hover {
        background: #f8f9ff;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #667eea;
        font-size: 1.2em;
      }

      .error {
        background: #fee;
        color: #c33;
        padding: 15px;
        border-radius: 8px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🛒 GlobalMart Data Explorer</h1>
        <p>Interactive Analytics Dashboard</p>
      </div>

      <div class="controls">
        <h3>🔍 Filter Data</h3>
        <div class="filter-group">
          <label>Time Period:</label>
          <select id="timePeriod">
            <option value="7">Last 7 Days</option>
            <option value="30" selected>Last 30 Days</option>
            <option value="90">Last 90 Days</option>
            <option value="365">Last Year</option>
            <option value="all">All Time</option>
          </select>

          <label>Top N:</label>
          <input
            type="number"
            id="topN"
            value="10"
            min="5"
            max="50"
            style="width: 80px"
          />

          <button onclick="loadAllData()">🔄 Refresh Data</button>
        </div>
      </div>

      <div id="statsGrid" class="stats-grid">
        <div class="stat-card">
          <h3>Total Revenue</h3>
          <div class="value" id="totalRevenue">$0</div>
        </div>
        <div class="stat-card">
          <h3>Total Transactions</h3>
          <div class="value" id="totalTransactions">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Customers</h3>
          <div class="value" id="totalCustomers">0</div>
        </div>
        <div class="stat-card">
          <h3>Avg Order Value</h3>
          <div class="value" id="avgOrderValue">$0</div>
        </div>
      </div>

      <div class="data-section">
        <h2>📦 Top Products by Revenue</h2>
        <div id="topProductsTable"></div>
      </div>

      <div class="data-section">
        <h2>🌍 Geographic Distribution</h2>
        <div id="geoTable"></div>
      </div>

      <div class="data-section">
        <h2>📊 Category Performance</h2>
        <div id="categoryTable"></div>
      </div>

      <div class="data-section">
        <h2>📈 Daily Sales Trend</h2>
        <div id="dailySalesTable"></div>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:8000/api/v1";

      async function fetchData(endpoint) {
        try {
          const response = await fetch(`${API_BASE}${endpoint}`);
          if (!response.ok)
            throw new Error(`HTTP error! status: ${response.status}`);
          return await response.json();
        } catch (error) {
          console.error("Error fetching data:", error);
          return null;
        }
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
        }).format(value);
      }

      function formatNumber(value) {
        return new Intl.NumberFormat("en-US").format(value);
      }

      async function loadSalesSummary() {
        const days = document.getElementById("timePeriod").value;
        const endpoint =
          days === "all"
            ? "/metrics/sales/summary?days=10000"
            : `/metrics/sales/summary?days=${days}`;
        const data = await fetchData(endpoint);

        if (data) {
          document.getElementById("totalRevenue").textContent = formatCurrency(
            data.total_revenue
          );
          document.getElementById("totalTransactions").textContent =
            formatNumber(data.total_transactions);
          document.getElementById("totalCustomers").textContent = formatNumber(
            data.total_customers
          );
          document.getElementById("avgOrderValue").textContent = formatCurrency(
            data.average_order_value
          );
        }
      }

      async function loadTopProducts() {
        const limit = document.getElementById("topN").value;
        const days = document.getElementById("timePeriod").value;
        const endpoint =
          days === "all"
            ? `/metrics/products/top?limit=${limit}`
            : `/metrics/products/top?limit=${limit}&days=${days}`;
        const data = await fetchData(endpoint);

        if (data && data.length > 0) {
          let html =
            "<table><thead><tr><th>Product ID</th><th>Category</th><th>Revenue</th><th>Units Sold</th><th>Times Purchased</th></tr></thead><tbody>";
          data.forEach((item) => {
            html += `<tr>
                        <td>${item.product_id}</td>
                        <td>${item.category}</td>
                        <td>${formatCurrency(item.revenue)}</td>
                        <td>${formatNumber(item.units_sold)}</td>
                        <td>${formatNumber(item.times_purchased)}</td>
                    </tr>`;
          });
          html += "</tbody></table>";
          document.getElementById("topProductsTable").innerHTML = html;
        } else {
          document.getElementById("topProductsTable").innerHTML =
            '<p class="error">No data available</p>';
        }
      }

      async function loadGeographicDistribution() {
        const data = await fetchData("/metrics/geographic/distribution");

        if (data && data.length > 0) {
          let html =
            "<table><thead><tr><th>Country</th><th>Orders</th><th>Revenue</th><th>Customers</th><th>Market Share</th></tr></thead><tbody>";
          data.forEach((item) => {
            html += `<tr>
                        <td>${item.country}</td>
                        <td>${formatNumber(item.orders)}</td>
                        <td>${formatCurrency(item.revenue)}</td>
                        <td>${formatNumber(item.customers)}</td>
                        <td>${item.market_share.toFixed(2)}%</td>
                    </tr>`;
          });
          html += "</tbody></table>";
          document.getElementById("geoTable").innerHTML = html;
        }
      }

      async function loadCategoryPerformance() {
        const limit = document.getElementById("topN").value;
        const data = await fetchData(
          `/metrics/categories/performance?limit=${limit}`
        );

        if (data && data.length > 0) {
          let html =
            "<table><thead><tr><th>Category</th><th>Revenue</th><th>Transactions</th><th>Units Sold</th></tr></thead><tbody>";
          data.forEach((item) => {
            html += `<tr>
                        <td>${item.category}</td>
                        <td>${formatCurrency(item.revenue)}</td>
                        <td>${formatNumber(item.transactions)}</td>
                        <td>${formatNumber(item.units_sold)}</td>
                    </tr>`;
          });
          html += "</tbody></table>";
          document.getElementById("categoryTable").innerHTML = html;
        }
      }

      async function loadDailySales() {
        const days = document.getElementById("timePeriod").value;
        const endpoint =
          days === "all"
            ? "/metrics/sales/daily?days=365"
            : `/metrics/sales/daily?days=${days}`;
        const data = await fetchData(endpoint);

        if (data && data.length > 0) {
          let html =
            "<table><thead><tr><th>Date</th><th>Revenue</th><th>Transactions</th></tr></thead><tbody>";
          data.forEach((item) => {
            html += `<tr>
                        <td>${item.date}</td>
                        <td>${formatCurrency(item.revenue)}</td>
                        <td>${formatNumber(item.transactions)}</td>
                    </tr>`;
          });
          html += "</tbody></table>";
          document.getElementById("dailySalesTable").innerHTML = html;
        }
      }

      async function loadAllData() {
        document.querySelectorAll(".data-section > div").forEach((div) => {
          div.innerHTML = '<div class="loading">⏳ Loading data...</div>';
        });

        await Promise.all([
          loadSalesSummary(),
          loadTopProducts(),
          loadGeographicDistribution(),
          loadCategoryPerformance(),
          loadDailySales(),
        ]);
      }

      // Load data on page load
      window.addEventListener("load", loadAllData);

      // Auto-refresh every 30 seconds
      setInterval(loadAllData, 30000);
    </script>
  </body>
</html>
